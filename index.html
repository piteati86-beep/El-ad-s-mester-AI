<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>ElőadásMester AI</title>
<style>
body{margin:0;background:#f4f6fa;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:22px 18px}main{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #0001}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;margin:4px;background:#e8edf5}.primary{background:#111827;color:#fff}.danger{background:#fee2e2;color:#991b1b}textarea{width:100%;min-height:260px;border:1px solid #d8dee9;border-radius:12px;padding:12px;font:inherit;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.item{background:#f8fafc;border-radius:12px;padding:12px;margin:7px 0}.tag{display:inline-block;background:#eef2ff;border-radius:999px;padding:6px 9px;margin:3px}.muted{color:#667085}.status{font-weight:700;margin:8px 0}
</style></head>
<body><header><h1>🎓 ElőadásMester AI</h1><div>Előadásból tananyag és vizsgafelkészítő</div></header><main>
<div class="card"><h2>🎙️ Hanganyag</h2><input id="file" type="file" accept="audio/*"><div><button class="primary" id="rec">Felvétel</button><button class="danger" id="stop" disabled>Leállítás</button><button id="trans">Átírás készítése</button></div><div id="status" class="status muted">Készen áll.</div></div>
<div class="card"><h2>📝 Teljes leirat</h2><textarea id="text" placeholder="Ide kerül az előadás teljes leirata."></textarea></div>
<div class="card"><h2>🧠 Tanulási csomag</h2><button class="primary" id="study">AI-tananyag készítése</button><div id="out"></div></div>
</main>
<script>
let mr,parts=[],blob;
const file=document.querySelector("#file"),text=document.querySelector("#text"),status=document.querySelector("#status");
rec.onclick=async()=>{try{let s=await navigator.mediaDevices.getUserMedia({audio:true});parts=[];mr=new MediaRecorder(s);mr.ondataavailable=e=>parts.push(e.data);mr.onstop=()=>{blob=new Blob(parts,{type:"audio/webm"});file.value="";status.textContent="Felvétel kész, átírható.";s.getTracks().forEach(t=>t.stop())};mr.start();rec.disabled=true;stop.disabled=false;status.textContent="🔴 Felvétel folyamatban…"}catch(e){status.textContent=e.message}};
stop.onclick=()=>{mr?.stop();rec.disabled=false;stop.disabled=true};
trans.onclick=async()=>{let b=blob||file.files[0];if(!b)return alert("Válassz hangfájlt vagy készíts felvételt.");status.textContent="⏳ Átírás folyamatban…";let f=new FormData();f.append("audio",b,"eloadas.webm");let r=await fetch("/api/transcribe",{method:"POST",body:f}),j=await r.json();if(!r.ok)throw alert(j.error);text.value=j.text;status.textContent="✅ Átírás elkészült."};
study.onclick=async()=>{if(!text.value.trim())return alert("Nincs leirat.");out.innerHTML="<p>⏳ Az AI elkészíti a tananyagot…</p>";let r=await fetch("/api/study",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({transcript:text.value})}),j=await r.json();if(!r.ok)return out.innerHTML="<p>"+j.error+"</p>";out.innerHTML=`<h3>${j.title}</h3><h3>📄 Összefoglaló</h3><p>${j.summary}</p><h3>📚 Jegyzet</h3>${j.notes.map(x=>`<div class=item>${x}</div>`).join("")}<h3>📌 Vázlat</h3><ol>${j.outline.map(x=>`<li>${x}</li>`).join("")}</ol><h3>💡 Kulcsfogalmak</h3>${j.key_terms.map(x=>`<span class=tag><b>${x.term}</b>: ${x.meaning}</span>`).join("")}<h3>🎯 Vizsgára fontos</h3>${j.exam_points.map(x=>`<div class=item>${x}</div>`).join("")}<h3>❓ Kikérdezés</h3>${j.questions.map(x=>`<div class=item><b>${x.question}</b><br>${x.answer}</div>`).join("")}`};
</script></body></html>
